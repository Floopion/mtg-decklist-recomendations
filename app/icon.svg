<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#111111"/>
  <!-- Card silhouette — slight tilt -->
  <rect x="8" y="4" width="16" height="22" rx="2" stroke="#e0e0e0" stroke-width="1.3" fill="none" transform="rotate(-3 16 15)"/>
  <!-- Inner frame -->
  <rect x="10.5" y="6.5" width="11" height="17" rx="1" stroke="#e0e0e0" stroke-width="0.5" fill="none" opacity="0.35" transform="rotate(-3 16 15)"/>
  <!-- Abstract mana pentagon -->
  <path d="M16 10 L19 12.2 L17.8 15.8 L14.2 15.8 L13 12.2 Z" stroke="#e0e0e0" stroke-width="0.8" fill="#e0e0e0" fill-opacity="0.08" transform="rotate(-3 16 15)" stroke-linejoin="miter"/>
  <!-- Divider -->
  <line x1="11" y1="17.5" x2="21" y2="17.5" stroke="#e0e0e0" stroke-width="0.5" opacity="0.45" transform="rotate(-3 16 15)"/>
  <!-- Text lines -->
  <line x1="11.5" y1="19.5" x2="20" y2="19.5" stroke="#e0e0e0" stroke-width="0.6" opacity="0.25" transform="rotate(-3 16 15)"/>
  <line x1="11.5" y1="21" x2="18" y2="21" stroke="#e0e0e0" stroke-width="0.6" opacity="0.18" transform="rotate(-3 16 15)"/>
</svg>
